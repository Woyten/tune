---
scales:
  - scl: "steps 1/12:2"
    kbm: ~
audio_buffers: [rotary_l, rotary_r] # Defines that the rotary_l and rotary_r buffers will be played back by the audio device
globals: []
templates:
  - name: WaveformPitch
    value:
      Mul:
        - Property: WaveformPitch
        - Semitones:
            Controller:
              kind: PitchBend
              map0: 0.0
              map1: 2.0
  - name: Fadeout
    value:
      Controller:
        kind: Damper
        map0: { Property: OffVelocitySet }
        map1: 0.0
envelopes:
  - name: SympatheticResonance
    fadeout: Fadeout
    attack_time: 0.01
    decay_rate: 0.0
    release_time: 0.01
    in_buffer: output
    out_buffers: [send_l, send_r] # Send the enveloped signal to the reverb effect
stages:
  - stage_type: Fluid # Use Fluid synth to render a sampled sound
    out_buffers: [voice_l, voice_r]
    note_input: Foreground
    soundfont_location: "/usr/share/sounds/sf2/MuseScore_General_Full.sf2"
  - stage_type: Magnetron # Use a Magnetron synth as a key-press aware waveguide resonator
    note_input: Background
    waveforms:
      - name: Audio-in
        envelope: SympatheticResonance
        stages:
          - stage_type: Processor # Load the output of Fluid synth into the internal waveform buffers
            in_buffer: voice_l
            in_external: true
            out_buffer: input
            out_level: 0.5
            processor_type: Pass
          - stage_type: Processor
            in_buffer: voice_r
            in_external: true
            out_buffer: input
            out_level: 0.5
            processor_type: Pass
          - stage_type: Processor # Pass the loaded date into a waveguide resonator
            in_buffer: input
            out_buffer: output # This buffer is picked up by the SympatheticResonance envelope
            out_level: 0.01
            processor_type: Waveguide
            buffer_size: 4096
            frequency: WaveformPitch
            cutoff:
              Controller:
                kind: Breath
                map0: 2000.0
                map1: 5000.0
            feedback: 1.0
            reflectance: Positive
  - stage_type: Processor
    in_buffer: voice_l
    out_buffer: rotary_l # Pass the output of Fluid synth to the audio device
    processor_type: Pass
  - stage_type: Processor
    in_buffer: voice_r
    out_buffer: rotary_r # Pass the output of Fluid synth to the audio device
    processor_type: Pass
  - stage_type: StereoProcessor
    in_buffers: [send_l, send_r]
    out_buffers: [rotary_l, rotary_r] # Send the reverbed signal to the audio device
    processor_type: Effect
    effect_type: SchroederReverb
    buffer_size: 100000
    gain: 0.2
    allpasses:
      - 5.1
      - 7.73
      - 10.0
      - 12.61
    allpass_feedback: 0.5
    combs:
      - - 25.31
        - 25.83
      - - 26.94
        - 27.46
      - - 28.96
        - 29.48
      - - 30.75
        - 31.27
      - - 32.24
        - 32.76
      - - 33.81
        - 34.33
      - - 35.31
        - 35.83
      - - 36.67
        - 37.19
    comb_feedback: 0.95
    cutoff: 5600.0
color_palette:
  root_color:
    red: 1.0
    green: 1.0
    blue: 0.5
    alpha: 1.0
  natural_color:
    red: 1.0
    green: 1.0
    blue: 1.0
    alpha: 1.0
  sharp_colors:
    - red: 0.5
      green: 0.0
      blue: 1.0
      alpha: 1.0
    - red: 0.0
      green: 0.0
      blue: 1.0
      alpha: 1.0
    - red: 0.0
      green: 0.5
      blue: 1.0
      alpha: 1.0
    - red: 0.5
      green: 0.5
      blue: 1.0
      alpha: 1.0
  flat_colors:
    - red: 0.5
      green: 1.0
      blue: 0.0
      alpha: 1.0
    - red: 0.0
      green: 1.0
      blue: 0.0
      alpha: 1.0
    - red: 0.0
      green: 1.0
      blue: 0.5
      alpha: 1.0
    - red: 0.5
      green: 1.0
      blue: 0.5
      alpha: 1.0
  enharmonic_colors:
    - red: 0.0
      green: 0.5
      blue: 0.5
      alpha: 1.0
    - red: 1.0
      green: 0.5
      blue: 0.5
      alpha: 1.0
    - red: 1.0
      green: 0.0
      blue: 1.0
      alpha: 1.0
    - red: 1.0
      green: 0.5
      blue: 1.0
      alpha: 1.0
